; Game fonts. Merged over ../engine/config/fonts.ini at GUIManager startup.
; Each [Font.<id>] bakes one pixel size. Match that size in Lua when you can for crisp text.
; Same .ttf may appear in multiple sections with different ids and size values.

[Font.marcellus_15]
path         = ../content/fonts/marcellus/marcellus_regular.ttf
size         = 15
glyph_ranges = default

