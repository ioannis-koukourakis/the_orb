[KeyBindings]
move_forward = W
move_backward = S
move_left = A
move_right = D
move_up = R
move_down = F
sprint = Left Shift
crouch = C
jump = Space
interact = E
game_pause = Escape
test_1 = 1
test_2 = 2
test_3 = 3
test_4 = 4
test_5 = 5
test_6 = 6
test_7 = 7
test_8 = 8
test_9 = 9
test_0 = 0
toggle_performance_metrics = Shift+=
reload_running_scripts = Shift+R
toggle_editor_mode = Ctrl+P

[MouseButtonBindings]
select = MouseButtonLeft
aim = MouseButtonRight

[GamepadButtonBindings]
jump = GamepadA
cancel = GamepadB
crouch = GamepadRightStick
interact = GamepadX
sprint_toggle = GamepadLeftStick
game_pause = GamepadStart

[GamepadAxisBindings]
move_forward = GamepadAxisLeftY-
move_backward = GamepadAxisLeftY+
move_left = GamepadAxisLeftX-
move_right = GamepadAxisLeftX+
aim = GamepadAxisTriggerLeft+
select = GamepadAxisTriggerRight+