; Font configuration loaded at startup
;
; [Font.<id>]           — registered by <id> so Lua scripts can reference them by name.
;                         DO NOT use this for game-specific fonts. 
;                         Game-specific fonts belong in ../content/config/fonts.ini.
;
; Fields:
;   path               = normalized/path/to/font.ttf
;   size               = font_size_in_pixels
;   glyph_ranges       = default|greek|cyrillic|japanese|...
;                        Compound ranges: e.g. default+greek
;   merge_font_path    = optional secondary font merged into this atlas slot.
;   merge_glyph_ranges = glyph range to bake from the merge font.
;   merge_font_size    = optional size override (pixels) for the merged font.

; ------------------------------------------------------------------
; Default engine UI
; ------------------------------------------------------------------

[Font.imgui_default]
path               = ../engine/fonts/inter/Inter-Regular.ttf
size               = 17
glyph_ranges       = default+greek
merge_font_path    = ../engine/fonts/font_awesome/fa-solid-900.ttf
merge_glyph_ranges = font_awesome_6_editor
