; -------------------------------------------------------
; Key chords use Ctrl, Shift, and Alt plus a key.
; Example: save_world = Ctrl+S
; Hold modifiers for tools stay as their own actions (control, shift, alt).
;
; Additions (no conflict with bindings below):
; - toggle_transform_snap = X
; - set_debug_view_1..11 = Alt+1..9, Alt+0, Alt+-
; -------------------------------------------------------

[KeyBindings]
move_forward = W
move_backward = S
move_left = A
move_right = D
move_up = E
move_down = Q
control = Left Ctrl
shift = Left Shift
alt = Left Alt
focus_selected = F
reveal_selection_in_hierarchy = Alt+F
focus_origin = .
frame_all = Shift+F
select_all = Ctrl+A
delete = Delete
gizmo_translate = W
gizmo_rotate = E
gizmo_scale = R
toggle_local_transform = T
cycle_gizmo_mode = Space
toggle_transform_snap = X
set_debug_view_1 = Alt+1
set_debug_view_2 = Alt+2
set_debug_view_3 = Alt+3
set_debug_view_4 = Alt+4
set_debug_view_5 = Alt+5
set_debug_view_6 = Alt+6
set_debug_view_7 = Alt+7
set_debug_view_8 = Alt+8
set_debug_view_9 = Alt+9
set_debug_view_10 = Alt+0
set_debug_view_11 = Alt+-
duplicate_selected = Ctrl+D
undo = Ctrl+Z
redo = Ctrl+Y
redo_alternate = Ctrl+Shift+Z
save_world = Ctrl+S
save_world_as = Ctrl+Shift+S
load_world = Ctrl+L
new_world = Ctrl+N
toggle_world_hierarchy = Shift+1
toggle_entity_settings = Shift+2
toggle_world_settings = Shift+3
toggle_material_editor = Shift+4
toggle_texture_packer = Shift+5
toggle_vertex_paint_tool = Shift+6
toggle_decorator_tool = Shift+7
toggle_terrain_patch_tool = Shift+8
toggle_agent_navigation = Shift+9
toggle_module_manager = Shift+0
toggle_entity_browser = Shift+Space
toggle_log = Shift+-
toggle_performance_metrics = Shift+=
reload_assets = Shift+R
toggle_global_physics_debug = Shift+C
toggle_mute_sounds = M
deselect_all = Escape
toggle_projection_mode = Keypad 5
snap_view_top = Keypad 7
snap_view_bottom = Ctrl+Keypad 7
snap_view_front = Keypad 1
snap_view_back = Ctrl+Keypad 1
snap_view_right = Keypad 3
snap_view_left = Ctrl+Keypad 3
toggle_editor_mode = Ctrl+P
toggle_editor_mode_alternate = Alt+P

; -------------------------------------------------------

[MouseButtonBindings]
select = MouseButtonLeft
aim = MouseButtonRight
rotate_view = MouseButtonMiddle

; -------------------------------------------------------

[MouseWheelBindings]
zoom_in = MouseWheelUp
zoom_out = MouseWheelDown

; -------------------------------------------------------
